name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Match the runtime Netlify uses (v24.19.0) so CI catches the same
          # bugs that would otherwise appear only in deployed builds. Was 20.
          node-version: 24
          cache: pnpm

      - name: Enable pnpm (from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck (all workspace packages)
        run: pnpm run typecheck

      - name: Unit tests (status + sample-data)
        run: pnpm --filter @workspace/api-server test
        env:
          # DB-backed owner-isolation tests are skipped unless this is set,
          # so CI stays green without provisioning a database.
          RUN_DB_TESTS: "0"
