name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    # Pinned, not `ubuntu-latest`. Two reasons:
    #  1. `ubuntu-latest` moves to Ubuntu 26 on 2026-10-19, which would change
    #     the toolchain under us without a commit.
    #  2. During runner shortages the moving label is the most contended queue;
    #     a specific version usually has free capacity sooner. A job that cannot
    #     acquire a runner fails with "not acquired by Runner of type hosted",
    #     which is what blocked the deploy job on 2026-10-05.
    runs-on: ubuntu-24.04
    # Ephemeral PostgreSQL so the DB-gated owner-isolation tests actually run
    # on every CI pass (matching the production Postgres on Neon).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expiryos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/expiryos
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # Match the runtime Render uses (v24.19.0) so CI catches the same
          # bugs that would otherwise appear only in deployed builds.
          # NOTE: `cache: pnpm` is intentionally omitted — setup-node with
          # cache=pnpm tries to locate the pnpm binary itself before corepack
          # has provided it, causing "Unable to locate executable file: pnpm".
          node-version: 24

      - name: Enable pnpm (from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck (all workspace packages)
        run: pnpm run typecheck

      - name: Apply database schema (drizzle-kit push)
        run: pnpm --filter @workspace/db run push

      - name: Unit + DB integration tests
        run: pnpm --filter @workspace/api-server test
        env:
          # Kept for parity with the job-level default. DB-gated tests
          # (`*.owner.test.ts`) run because a Postgres service is provisioned.
          RUN_DB_TESTS: "1"

  # Deploy to Netlify ONLY after the typecheck-and-test gate passes, and only
  # on pushes to main (never on pull_request, never on a failed check).
  # This prevents wasting Netlify build/deploy credits on broken code.
  deploy-netlify:
    needs: typecheck-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (from packageManager field)
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Build web app
        run: pnpm --filter @workspace/expiry-os run build

      # Tripwire against a silent regression to the known-bad bundle.
      # index-C2cMtcLG.js shipped a fetch wrapper that called response.json()
      # unconditionally, so HTTP 204 (returned by DELETE /items/{id}) threw a
      # SyntaxError and the UI reported "Failed to delete item" even though the
      # row was deleted. If a build ever produces this hash again, stop here
      # rather than shipping it. See DELETE_BUTTON_INVESTIGATION.md.
      - name: Guard against stale bundle
        run: |
          if grep -q "index-C2cMtcLG.js" artifacts/expiry-tracker/dist/public/index.html; then
            echo "::error::Built index.html still references the known-stale bundle index-C2cMtcLG.js"
            exit 1
          fi

      - name: Deploy to Netlify (production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: artifacts/expiry-tracker/dist/public
          deploy-message: "Deploy from GitHub Actions (main)"
          production-deploy: true
          enable-commit-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # MUST stay true. This action's default is `false`, which makes it
          # log "Netlify credentials not provided, not deployable" and exit 0 —
          # a green checkmark for a deploy that never happened. That is how an
          # August bundle stayed live while CI looked healthy.
          fails-without-credentials: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Proves the deploy reached expiryos.netlify.app AND that the site is now
      # serving the exact bundle this run produced.
      #
      # The earlier smoke check only asked "is the site up?", which the stale
      # bundle also answers yes to — that is how a broken deploy passed. This
      # step reads the bundle filename out of both index.html files and
      # compares them. A mismatch means the deploy landed on a different
      # Netlify site than the one serving this domain.
      - name: Confirm the live site runs the new build
        run: |
          set -euo pipefail

          built=$(grep -o '/assets/index-[A-Za-z0-9_-]*\.js' \
            artifacts/expiry-tracker/dist/public/index.html | head -n 1 || true)
          live=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://expiryos.netlify.app/ \
            | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -n 1 || true)

          echo "Bundle this build produced: ${built:-<not found>}"
          echo "Bundle the live site serves: ${live:-<not found>}"

          if [ -z "$built" ] || [ -z "$live" ]; then
            echo "::error::Could not read a bundle name from the build output or from the live site."
            exit 1
          fi

          if [ "$built" != "$live" ]; then
            echo "::error::The live site serves $live but this build produced $built."
            echo "::error::The deploy did not reach expiryos.netlify.app. The most likely cause is that NETLIFY_SITE_ID points at a different Netlify site. Compare it with the API ID shown in Netlify under Site settings for expiryos.netlify.app."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://expiryos.netlify.app/api/session
          echo ""
          echo "::notice::The live site is serving the bundle from this build, and the API answers."
